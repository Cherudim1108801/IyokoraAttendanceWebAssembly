# このファイルは Firebase CLI が自動生成したテンプレートを元に、
# .NET (Blazor WebAssembly) 向けのビルド手順（dotnet publish）を追加したもの。
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish IyokoraAttendanceWebAssembly/IyokoraAttendanceWebAssembly.csproj --configuration Release
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IYOKORAATTENDANCEAPP }}
          projectId: iyokoraattendanceapp
