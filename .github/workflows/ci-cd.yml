name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IyokoraAttendanceWebAssembly.slnx

      - name: Build
        run: dotnet build IyokoraAttendanceWebAssembly.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test IyokoraAttendanceWebAssembly.Tests/IyokoraAttendanceWebAssembly.Tests.csproj --no-build --configuration Release

  deploy:
    name: Deploy to Firebase Hosting
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (Release)
        run: dotnet publish IyokoraAttendanceWebAssembly/IyokoraAttendanceWebAssembly.csproj --configuration Release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IYOKORAATTENDANCEAPP }}'
          channelId: live
          projectId: iyokoraattendanceapp
